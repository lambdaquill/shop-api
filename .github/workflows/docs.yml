name: Update Docs
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]      # the bot's own commit must not retrigger this workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc (only if extra formats requested)
        if: vars.DOC_FORMATS != ''
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-latex-base

      - run: pip install -r requirements-docs.txt

      - name: Update documentation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BASE_SHA: ${{ github.event.before }}
          DOC_FORMATS: ${{ vars.DOC_FORMATS }}        # optional: "pdf,docx"
          DOC_CHANGELOG: ${{ vars.DOC_CHANGELOG }}    # optional: "true" adds a Recent Changes table
        run: python run_agent.py

      - name: Commit docs
        run: |
          git config user.name "doc-bot"
          git config user.email "doc-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No doc changes."
          else
            git commit -m "docs: auto-update [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
